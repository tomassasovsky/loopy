name: session_repository
description: >-
  Saves and restores Segno sessions (.segno bundles) and exports mixdown +
  per-track WAV stems via the audio engine.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  segno_engine:
    path: ../segno_engine
  wav_codec:
    path: ../wav_codec
dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
