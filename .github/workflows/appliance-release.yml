# Appliance (Pi 4B) update release pipeline — #304.
# Builds the signed RAUC .raucb + a channel manifest and publishes them to a GitHub
# Release; CI then POSTs /hooks/sync so segno.aquiles.dev mirrors immediately
# (poll remains the fallback).
#
#   push to `experimental`  -> experimental channel (GitHub prerelease)
#   push tag `v*`           -> production  channel (GitHub full release)
#   workflow_dispatch       -> pick the channel (and, optionally, the runner)
#
# Split into two build jobs with an artifact hand-off:
#   build-app   — always on GitHub's free native ubuntu-24.04-arm runner. The
#                 app Dockerfile (deploy/rpi/build) has no --platform and isn't
#                 built for QEMU emulation, so this step needs a real arm64 host.
#   build-image — the heavy ~2h Yocto/RAUC build. Defaults to the same
#                 GitHub-hosted runner; opt into a self-hosted runner (deployed
#                 from github.com/tomassasovsky/homelab-gh-runner, labels
#                 self-hosted,linux,x64,proxmox,yocto) via workflow_dispatch
#                 `runner: self-hosted` (#323) for a persistent local sstate
#                 cache instead of round-tripping the GitHub Actions cache.
#
# PREREQUISITES (repo settings):
#   - Secrets: RAUC_SIGNING_KEY (development-1.key.pem), RAUC_SIGNING_CERT
#     (development-1.cert.pem).  NOTE: the CA/keyring is baked into the image; this
#     signs bundles.
#   - A full Yocto build is heavy. First run on a given runner is cold; later runs
#     restore sstate/downloads (GitHub Actions cache on the free runner — raise the
#     repo's cache size limit past ~15GB in Settings > Actions > Caches; a named
#     volume on the self-hosted runner).
name: appliance-release

on:
  push:
    branches: [experimental]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [experimental, production]
        default: experimental
      runner:
        description: Where to run the Yocto/RAUC build
        type: choice
        options: [github, self-hosted]
        default: github

permissions:
  contents: write        # create releases

jobs:
  determine-meta:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine channel + version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ github.event.inputs.channel }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            channel="production"
          else
            channel="experimental"
          fi

          # VERSION is the human-controlled source of truth for X.Y.Z (kept
          # below 1.0.0 while unreleased). CI never invents base versions —
          # only channel-appropriate suffixes:
          #   production + tag vX.Y.Z  -> X.Y.Z (the tag itself)
          #   production + dispatch    -> VERSION file as-is
          #   experimental             -> <VERSION>-experimental.<run_number>
          # so an unsuffixed production release correctly sorts newer than
          # any of its own experimental prereleases (semver precedence).
          base="$(tr -d '[:space:]' < VERSION)"
          if [ "$channel" = "production" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="$base"
            fi
          else
            version="${base}-experimental.${{ github.run_number }}"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building channel=$channel version=$version"

  build-app:
    needs: determine-meta
    runs-on: ubuntu-24.04-arm      # native aarch64 — always, see header note
    steps:
      - uses: actions/checkout@v7

      - name: Build the aarch64 app bundle
        run: |
          docker build -t loopy-arm64-build deploy/rpi/build
          docker run --rm -v "$PWD":/workspace loopy-arm64-build --dart-define=LOOPY_CONSOLE=true

      - uses: actions/upload-artifact@v7
        with:
          name: loopy-app-bundle
          path: build/linux/arm64/release/bundle
          retention-days: 1

  # The paired Pro Micro firmware, published as a sibling of the .raucb so the
  # appliance can flash it with the same update action (#331 part C). Plain
  # ubuntu-latest: arduino-cli cross-compiles for AVR in well under a minute, so
  # this never needs the arm64 or Yocto runners and never gates them.
  build-pedal-firmware:
    needs: determine-meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install arduino-cli + the AVR core
        run: |
          set -eu
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s 0.35.3
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Compile loopy_pedal_32u4
        env:
          VERSION: ${{ needs.determine-meta.outputs.version }}
        run: |
          set -eu
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          # One shared recipe with the PR gate in main.yaml — see build.sh.
          hardware/firmware/loopy_pedal_32u4/build.sh pedal-firmware "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: loopy-pedal-firmware
          path: pedal-firmware
          retention-days: 1

  build-image:
    needs: [determine-meta, build-app, build-pedal-firmware]
    # Opt-in self-hosted (#323): a workflow_dispatch explicitly asking for it.
    # Push-triggered runs have no `inputs` context, so this always resolves to
    # the free GitHub-hosted runner for them.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64","proxmox","yocto"]') || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: loopy-app-bundle
          path: deploy/yocto/prebuilt/bundle

      - uses: actions/download-artifact@v8
        with:
          name: loopy-pedal-firmware
          path: pedal-firmware

      - name: Restore the app binary's executable bit
        # loopy-bundle.bb's do_install checks `[ -x "${bundle}/loopy" ]`; the
        # upload/download-artifact round-trip doesn't reliably preserve it.
        run: chmod +x deploy/yocto/prebuilt/bundle/loopy

      - name: Stage RAUC signing material
        run: |
          kd=deploy/yocto/meta-loopy/.rauc-keys
          mkdir -p "$kd"
          printf '%s' "${{ secrets.RAUC_SIGNING_KEY }}"  > "$kd/development-1.key.pem"
          printf '%s' "${{ secrets.RAUC_SIGNING_CERT }}" > "$kd/development-1.cert.pem"
          chmod 600 "$kd/development-1.key.pem"

      - name: Determine Yocto work dir
        run: |
          if [ "${{ inputs.runner }}" = "self-hosted" ]; then
            # Host bind mount (not a named volume -- Docker-outside-of-Docker
            # via socket mount needs an identical path on both sides for
            # kas-container's own nested `docker run` bind mounts to resolve;
            # see homelab-gh-runner's README). Path is keyed by this
            # deployment's RUNNER_NAME (proxmox-loopy-yocto); persists across
            # builds without touching the GitHub Actions cache at all.
            echo "YOCTO_WORK_DIR=/opt/gh-runner-cache/proxmox-loopy-yocto/build-cache/yocto" >> "$GITHUB_ENV"
          else
            echo "YOCTO_WORK_DIR=$HOME/yocto-build" >> "$GITHUB_ENV"
          fi

      - name: Restore Yocto sstate + downloads (GitHub-hosted only)
        if: inputs.runner != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.YOCTO_WORK_DIR }}/sstate-cache
            ${{ env.YOCTO_WORK_DIR }}/downloads
          key: yocto-sstate-${{ runner.os }}-${{ hashFiles('deploy/yocto/**') }}
          restore-keys: yocto-sstate-${{ runner.os }}-

      - name: Build the signed RAUC bundle
        env:
          # kas-container refuses to run bitbake as root unless told to. The
          # GitHub-hosted runner's job user isn't root, so this is a no-op
          # there; the homelab-gh-runner self-hosted runner's job user IS root
          # (RUN_AS_ROOT, needed to match the mounted host docker.sock's
          # group), so this opts in explicitly for that path.
          KAS_ALLOW_ROOT: "yes"
        run: |
          curl -fsSL -O https://raw.githubusercontent.com/siemens/kas/master/kas-container
          chmod +x kas-container
          mkdir -p "$YOCTO_WORK_DIR"
          KAS_WORK_DIR="$YOCTO_WORK_DIR" KAS_CONTAINER_ENGINE=docker \
            ./kas-container shell deploy/yocto/kas-loopy-rpi4.yml \
            -c "LOOPY_BUILD_VERSION=${{ needs.determine-meta.outputs.version }} LOOPY_UPDATE_CHANNEL=${{ needs.determine-meta.outputs.channel }} bitbake loopy-update-bundle"

      - name: Collect bundle + write manifest
        id: artifacts
        run: |
          set -eu
          out=release-artifacts; mkdir -p "$out"
          raucb=$(readlink -f "$YOCTO_WORK_DIR"/*/tmp/deploy/images/raspberrypi4-64/loopy-update-bundle-raspberrypi4-64.raucb 2>/dev/null \
                  || find "$YOCTO_WORK_DIR" -name 'loopy-update-bundle-raspberrypi4-64-*.raucb' | sort | tail -1)
          bundle="loopy-appliance-${{ needs.determine-meta.outputs.version }}.raucb"
          cp "$raucb" "$out/$bundle"
          sha=$(sha256sum "$out/$bundle" | cut -d' ' -f1)
          # version is a semver string (e.g. "0.2.0" / "0.2.0-experimental.9")
          # — must be JSON-quoted. The int-era unquoted form is no longer valid.
          version='${{ needs.determine-meta.outputs.version }}'
          channel='${{ needs.determine-meta.outputs.channel }}'

          # The pedal firmware rides along as a sibling of the bundle, not
          # inside it: RAUC bundles are OS A/B slot images, and the pedal is a
          # USB-attached MCU flashed with avrdude. A missing .hex degrades to a
          # manifest with no pedalFirmware block — an OS-only update — rather
          # than failing the release.
          hex="loopy-pedal-${version}.hex"
          pedal_block=""
          if [ -f "pedal-firmware/$hex" ]; then
            cp "pedal-firmware/$hex" "$out/$hex"
            hex_sha=$(sha256sum "$out/$hex" | cut -d' ' -f1)
            proto=$(tr -d '[:space:]' < pedal-firmware/protocol-version || echo "")
            # Interpolated as a bare JSON number, so an empty or non-numeric
            # read would publish a manifest no client can parse. 0 is the
            # schema's own "unknown" and degrades safely.
            case "$proto" in ''|*[!0-9]*) proto=0 ;; esac
            pedal_block=", \"pedalFirmware\": { \"version\": \"$version\", \"hex\": \"$hex\", \"protocolVersion\": $proto, \"sha256\": \"$hex_sha\" }"
          else
            echo "::warning::no pedal firmware .hex found; publishing an OS-only manifest"
          fi

          cat > "$out/manifest.json" <<EOF
          { "version": "$version", "bundle": "$bundle", "sha256": "$sha", "channel": "$channel"$pedal_block }
          EOF
          # Pretty-print if jq is on the runner; never fail the release over a
          # log nicety, two hours into the build.
          jq . "$out/manifest.json" || cat "$out/manifest.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: appliance-${{ needs.determine-meta.outputs.channel }}-${{ needs.determine-meta.outputs.version }}
          name: "Appliance ${{ needs.determine-meta.outputs.channel }} ${{ needs.determine-meta.outputs.version }}"
          prerelease: ${{ needs.determine-meta.outputs.channel == 'experimental' }}
          files: |
            release-artifacts/*.raucb
            release-artifacts/*.hex
            release-artifacts/manifest.json

      # Devices read from segno.aquiles.dev, not GitHub. Nudge the mirror now so
      # Check Now does not wait for the poll interval (default 300s). Soft-fail:
      # a missed trigger still gets picked up by the next poll.
      - name: Trigger segno mirror sync
        env:
          SEGNO_SYNC_TOKEN: ${{ secrets.SEGNO_SYNC_TOKEN }}
          SEGNO_SYNC_URL: https://segno.aquiles.dev/hooks/sync
        run: |
          set -eu
          if [ -z "${SEGNO_SYNC_TOKEN:-}" ]; then
            echo "::warning::SEGNO_SYNC_TOKEN unset; segno will catch up on next poll"
            exit 0
          fi
          # Brief retries: GitHub's Releases API can lag a few seconds after publish.
          for i in 1 2 3 4 5 6; do
            echo "segno sync attempt $i…"
            if out=$(curl -fsS -X POST \
                -H "Authorization: Bearer ${SEGNO_SYNC_TOKEN}" \
                --max-time 300 \
                "$SEGNO_SYNC_URL"); then
              printf '%s\n' "$out"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::segno sync trigger failed after retries; poll will catch up"
