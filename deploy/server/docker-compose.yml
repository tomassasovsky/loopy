# Loopy / segno update server — static host for appliance RAUC bundles + manifest
# (and desktop appcasts later). Deploy as a Portainer stack. The user's nginx
# reverse-proxies https://segno.aquiles.dev -> 127.0.0.1:3029 (this container).
#
# Publish an update = drop files into ./www/updates/... on the host (see README).
services:
  segno-updates:
    image: nginx:1.27-alpine
    container_name: segno-updates
    restart: unless-stopped
    ports:
      - "3029:80"            # host 3029 (behind the user's nginx) -> nginx :80
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
