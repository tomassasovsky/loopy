# Loopy / segno update server — static host for appliance RAUC bundles + manifest
# (and desktop appcasts later). Deploy as a Portainer stack. Publishes host port
# 3029; the user's Nginx Proxy Manager points segno.aquiles.dev at <host>:3029.
#
# Publish an update = drop files into ./www/updates/... on the host (see README).
services:
  segno-updates:
    image: nginx:1.27-alpine
    container_name: segno-updates
    restart: unless-stopped
    ports:
      - "3029:3029"          # host 3029 -> nginx (listens on 3029; see default.conf)
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3029/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
