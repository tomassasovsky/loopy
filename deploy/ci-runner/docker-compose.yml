# Self-hosted GitHub Actions runner for the appliance-release.yml Yocto/RAUC
# build job. See deploy/ci-runner/README.md for the full setup (PAT creation +
# Portainer deployment). Deploy as a Portainer *git repository* stack, same
# pattern as segno-updates: no host-file binds, named volumes only.
#
# The runner:
#   - registers itself to tomassasovsky/loopy using ACCESS_TOKEN (a fine-
#     grained PAT), which it also uses to silently re-register on every
#     restart -- no manual token refresh.
#   - shares the HOST Docker daemon (socket mount, not Docker-in-Docker) so
#     `kas-container`'s internal `docker run` calls work exactly like they do
#     on a GitHub-hosted runner.
#   - keeps the Yocto sstate-cache + downloads on a NAMED VOLUME that persists
#     across container restarts/redeploys, so the appliance-release workflow's
#     "Build the signed RAUC bundle" step goes warm after the first run,
#     without going through the GitHub Actions cache service at all.
services:
  loopy-yocto-runner:
    image: myoung34/github-runner:latest
    container_name: loopy-yocto-runner
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/tomassasovsky/loopy
      # Fine-grained PAT, repo tomassasovsky/loopy only, Administration:
      # read-write (+ default Metadata: read-only). Set as a Portainer STACK
      # environment variable, never committed here. See README.md.
      ACCESS_TOKEN: ${GH_RUNNER_PAT}
      RUNNER_NAME: proxmox-yocto
      RUNNER_SCOPE: repo
      # Matches the appliance-release.yml self-hosted job's `runs-on` labels.
      LABELS: self-hosted,linux,x64,proxmox,yocto
      RUNNER_WORKDIR: /tmp/runner/work
      # Persistent (not ephemeral): a torn-down/recreated container re-attaches
      # to the same named volumes below, so the sstate cache survives restarts.
      EPHEMERAL: "false"
      DISABLE_AUTO_UPDATE: "true"
      # The image's entrypoint otherwise needs the container's internal
      # `runner` user to match the host docker.sock's group ownership; running
      # as root sidesteps that GID-matching dance for a single-purpose,
      # non-multi-tenant homelab runner.
      RUN_AS_ROOT: "true"
    volumes:
      - runner-work:/tmp/runner/work
      - yocto-sstate:/yocto-build
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  runner-work:
  yocto-sstate:
