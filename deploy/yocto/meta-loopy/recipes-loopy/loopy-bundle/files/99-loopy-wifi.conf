# Appliance WiFi: join reliability on brcmfmac / headless NM.
[device]
# MAC randomization breaks join on some APs ("Secrets were required" / not found).
wifi.scan-rand-mac-address=no
# World regdom (00) puts 5 GHz in PASSIVE-SCAN and makes ch 36–48 flaky on Pi.
# AR matches the lab locale; override with LOOPY_WIFI_COUNTRY later if needed.
wifi.country=AR

[connection]
# 2 = disable (brcmfmac power-save commonly fails the 4-way handshake).
wifi.powersave=2

# Persist WiFi (and any other) profiles on /data so A/B OTA does not wipe them.
# loopy-nm-persist.service mkdir's this path before NetworkManager starts.
[keyfile]
path=/data/NetworkManager/system-connections
