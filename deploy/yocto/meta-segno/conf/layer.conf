# meta-segno: the floor-console appliance layer (Tier 3a spike, issue #284).
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "segno"
BBFILE_PATTERN_segno = "^${LAYERDIR}/"
BBFILE_PRIORITY_segno = "10"

# Depends on oe-core, meta-raspberrypi, and meta-oe (for GTK3 etc.).
LAYERDEPENDS_segno = "core raspberrypi openembedded-layer"
LAYERSERIES_COMPAT_segno = "scarthgap styhead walnascar"
