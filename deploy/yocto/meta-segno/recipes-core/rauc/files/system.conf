# RAUC system config for the Segno appliance — Raspberry Pi firmware tryboot A/B.
# https://rauc.readthedocs.io/en/latest/reference.html#system-section
[system]
# MUST byte-match RAUC_BUNDLE_COMPATIBLE in segno-update-bundle.bb, or the device
# rejects the bundle. Fixed string (not ${MACHINE}${TARGET_VENDOR}) so it can't drift.
compatible=segno-raspberrypi4
bootloader=custom
data-directory=/boot/rauc

[keyring]
path=/etc/rauc/keyring.pem

[handlers]
system-info=/usr/lib/rauc/rpi-firmware/system-info
bootloader-custom-backend=/usr/lib/rauc/rpi-firmware/bootloader-custom-backend

# Slot groups: each boot(FAT) slot is parent'ed to its rootfs slot so they update
# together (kernel in boot slot, its modules in the rootfs slot). Device numbers
# match segno-tryboot.wks: bootA=p2, bootB=p3, rootA=p5, rootB=p6.
[slot.firmware.0]
device=/dev/mmcblk0p2
type=vfat
parent=rootfs.0

[slot.firmware.1]
device=/dev/mmcblk0p3
type=vfat
parent=rootfs.1

[slot.rootfs.0]
device=/dev/mmcblk0p5
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p6
type=ext4
bootname=B
