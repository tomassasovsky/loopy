# Appliance WiFi: join reliability on brcmfmac / headless NM.
[device]
# MAC randomization breaks join on some APs ("Secrets were required" / not found).
wifi.scan-rand-mac-address=no
# iwd drives the radio, not wpa_supplicant (#468 step 2). The networkmanager
# bbappend enables it; stated here too so the choice is visible where the rest
# of the WiFi policy lives.
wifi.backend=iwd
# ...but NetworkManager keeps ownership of WHICH network to join. With iwd
# autoconnect on, iwd picks from its own store under /var/lib/iwd — inside the
# RAUC slot, so an OS update would forget every network and undo #432. Leaving
# it off keeps NM's profiles on /data authoritative.
wifi.iwd.autoconnect=no

[connection]
# 2 = disable (brcmfmac power-save commonly fails the 4-way handshake).
wifi.powersave=2

# Persist WiFi (and any other) profiles on /data so A/B OTA does not wipe them.
# segno-nm-persist.service mkdir's this path before NetworkManager starts.
[keyfile]
path=/data/NetworkManager/system-connections
